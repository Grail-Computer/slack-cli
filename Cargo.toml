[package]
name = "slk"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Standalone Grail Slack and WhatsApp macOS CLI"
repository = "https://github.com/Grail-Computer/slack-cli"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"
regex = "1"
snap = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
